<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marquee — search and watch</title>
<meta name="description" content="Search YouTube and watch videos inline.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <a href="#top" class="wordmark">Marquee</a>
  </header>

  <main id="top">
    <section class="hero">
      <h1 class="hero-title">Search. Press play.<br>Watch it here.</h1>

      <form class="search-form" id="yt-form">
        <label for="yt-query" class="sr-only">Search videos</label>
        <input
          type="text"
          id="yt-query"
          class="search-input"
          placeholder="Search for a video…"
          autocomplete="off"
          required
        >
        <button type="submit" class="search-btn">Search</button>
      </form>
    </section>

    <section class="screen-section">
      <div class="screen" id="screen">
        <div class="screen-placeholder" id="screen-placeholder">
          <p>Nothing playing yet — search above, then pick a video.</p>
        </div>
        <div class="player-wrap" id="player-wrap">
          <iframe
            id="player"
            src=""
            title="Video player"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </div>
      <p class="now-playing" id="now-playing"></p>
    </section>

    <section class="results-section">
      <p class="status" id="status"></p>
      <ul class="results" id="results"></ul>
    </section>
  </main>

  <footer class="footer">
    <p>Built with the YouTube Data API. Not affiliated with YouTube or Google.</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
